<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Myra AI - New Automation</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  body { background-color: #13131b; color: #e4e1ed; font-family: 'Be Vietnam Pro', sans-serif; min-height: 100dvh; }
  .glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(138, 235, 255, 0.2); backdrop-filter: blur(12px); }
</style>
</head>
<body class="p-4 pb-24">

<!-- Header -->
<header class="flex items-center justify-between gap-3 mb-6 pt-2">
  <div class="flex items-center gap-3">
    <a href="automation-studio.html" class="p-2 rounded-xl bg-white/5 border border-white/10 hover:border-cyan-400 text-cyan-300">
      <span class="material-symbols-outlined text-xl">arrow_back</span>
    </a>
    <div>
      <h1 class="text-xl font-bold tracking-tight text-cyan-300" style="font-family:'Sora'">NEW_ROUTINE</h1>
      <p class="text-[10px] font-mono text-cyan-400/80">FLOW COMPOSER • STEP BY STEP</p>
    </div>
  </div>
  <a href="automation-studio.html" class="text-xs text-white/50 hover:text-cyan-300 font-mono">Cancel</a>
</header>

<div class="glass rounded-2xl p-5 mb-5 flex flex-col gap-4">
  <div>
    <label class="block text-xs font-mono uppercase text-cyan-300 mb-1.5">Flow Name</label>
    <input type="text" placeholder="e.g. Eco Lighting Sleep Mode" value="Office Evening Shutdown"
      class="w-full bg-[#1b1b23] border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 font-mono" />
  </div>

  <div>
    <label class="block text-xs font-mono uppercase text-cyan-300 mb-1.5">Select Trigger Type</label>
    <div class="grid grid-cols-2 gap-2 font-mono text-xs">
      <a href="automation-time.html" class="p-3.5 rounded-xl bg-cyan-950/40 border border-cyan-400 text-white flex flex-col gap-1">
        <span class="material-symbols-outlined text-cyan-400 text-xl">schedule</span>
        <span class="font-bold">Time Trigger</span>
        <span class="text-[10px] text-white/50">Cron or clock hour</span>
      </a>
      <a href="automation-action.html" class="p-3.5 rounded-xl bg-white/5 border border-white/10 text-white/80 hover:border-cyan-400 flex flex-col gap-1">
        <span class="material-symbols-outlined text-indigo-400 text-xl">sensors</span>
        <span class="font-bold">Sensor Event</span>
        <span class="text-[10px] text-white/50">Motion or threshold</span>
      </a>
    </div>
  </div>
</div>

<div class="glass rounded-2xl p-5 mb-6 flex flex-col gap-3">
  <div class="flex items-center justify-between">
    <h2 class="text-xs font-mono uppercase text-cyan-300 font-semibold">Action Sequence</h2>
    <a href="automation-action.html" class="text-xs text-cyan-400 hover:underline font-mono">+ Add Action</a>
  </div>

  <div class="p-3.5 rounded-xl bg-[#0d0d15] border border-white/10 flex items-center justify-between text-xs font-mono">
    <div class="flex items-center gap-3">
      <span class="w-6 h-6 rounded-lg bg-cyan-950 text-cyan-400 flex items-center justify-center font-bold text-xs">1</span>
      <div>
        <p class="text-white">turnOffSmartPlugs()</p>
        <p class="text-[10px] text-white/50">LAN Broadcast IoT Bridge</p>
      </div>
    </div>
    <span class="material-symbols-outlined text-white/40 text-sm">drag_indicator</span>
  </div>

  <div class="p-3.5 rounded-xl bg-[#0d0d15] border border-white/10 flex items-center justify-between text-xs font-mono">
    <div class="flex items-center gap-3">
      <span class="w-6 h-6 rounded-lg bg-cyan-950 text-cyan-400 flex items-center justify-center font-bold text-xs">2</span>
      <div>
        <p class="text-white">armSecuritySensors()</p>
        <p class="text-[10px] text-white/50">Home_Security_Bot</p>
      </div>
    </div>
    <span class="material-symbols-outlined text-white/40 text-sm">drag_indicator</span>
  </div>
</div>

<button onclick="alert('Automation routine created and active!')" class="w-full py-3.5 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-black font-semibold font-mono text-sm shadow-[0_0_15px_rgba(34,211,238,0.4)] flex items-center justify-center gap-2">
  <span class="material-symbols-outlined text-base">save</span>
  <span>Save &amp; Activate Routine</span>
</button>

</body>
</html>
