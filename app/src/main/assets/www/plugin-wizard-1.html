<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Plugin Wizard - Step 1: Basics</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  body { background-color: #13131b; color: #e4e1ed; font-family: 'Be Vietnam Pro', sans-serif; min-height: 100dvh; }
  .glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(138, 235, 255, 0.2); backdrop-filter: blur(12px); }
</style>
</head>
<body class="p-4 pb-24">

<!-- Header -->
<header class="flex items-center justify-between gap-3 mb-4 pt-2">
  <div class="flex items-center gap-3">
    <a href="index.html" class="p-2 rounded-xl bg-white/5 border border-white/10 hover:border-cyan-400 text-cyan-300">
      <span class="material-symbols-outlined text-xl">arrow_back</span>
    </a>
    <div>
      <h1 class="text-xl font-bold tracking-tight text-[#8aebff]" style="font-family:'Sora'">PLUGIN_CREATOR</h1>
      <p class="text-[10px] font-mono text-cyan-400/80">STEP 1 OF 4 • MODULE IDENTITY</p>
    </div>
  </div>
  <a href="plugin-manager.html" class="text-xs text-white/50 hover:text-cyan-300 font-mono">Cancel</a>
</header>

<!-- Step Progress Indicator -->
<div class="flex items-center gap-2 mb-6">
  <div class="flex-1 h-1.5 rounded-full bg-cyan-400 shadow-[0_0_8px_#22d3ee]"></div>
  <div class="flex-1 h-1.5 rounded-full bg-white/10"></div>
  <div class="flex-1 h-1.5 rounded-full bg-white/10"></div>
  <div class="flex-1 h-1.5 rounded-full bg-white/10"></div>
</div>

<!-- Form Card -->
<div class="glass rounded-2xl p-5 mb-6 flex flex-col gap-4">
  <div>
    <label class="block text-xs font-mono uppercase text-cyan-300 mb-1.5">Module Name</label>
    <input type="text" id="pluginName" value="Home_Security_Bot" placeholder="e.g. Weather_Watcher"
      class="w-full bg-[#1b1b23] border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 font-mono" />
    <span class="text-[10px] text-white/40 mt-1 block">Must follow alphanumeric_underscore convention</span>
  </div>

  <div>
    <label class="block text-xs font-mono uppercase text-cyan-300 mb-1.5">Module Namespace ID</label>
    <input type="text" id="pluginId" value="com.myra.ext.security.bot"
      class="w-full bg-[#1b1b23] border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 font-mono" />
  </div>

  <div>
    <label class="block text-xs font-mono uppercase text-cyan-300 mb-1.5">Module Type / Archetype</label>
    <div class="grid grid-cols-2 gap-2">
      <label class="p-3 rounded-xl border border-cyan-400 bg-cyan-950/40 flex items-center gap-2 cursor-pointer">
        <input type="radio" name="modType" checked class="accent-cyan-400"/>
        <div>
          <p class="text-xs font-semibold text-white">EXT-MODULE</p>
          <p class="text-[10px] text-white/50">Edge peripheral &amp; IoT</p>
        </div>
      </label>
      <label class="p-3 rounded-xl border border-white/10 bg-white/5 flex items-center gap-2 cursor-pointer">
        <input type="radio" name="modType" class="accent-cyan-400"/>
        <div>
          <p class="text-xs font-semibold text-white">SYS-MODULE</p>
          <p class="text-[10px] text-white/50">Core neural extension</p>
        </div>
      </label>
    </div>
  </div>

  <div>
    <label class="block text-xs font-mono uppercase text-cyan-300 mb-1.5">Description</label>
    <textarea rows="3" class="w-full bg-[#1b1b23] border border-white/15 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-cyan-400 font-sans">Autonomous perimeter monitoring bot with real-time biometric anomaly detection and encrypted vault telemetry.</textarea>
  </div>
</div>

<!-- Bottom Action -->
<div class="flex items-center justify-between gap-4">
  <a href="index.html" class="px-5 py-3 rounded-xl bg-white/5 border border-white/10 text-xs font-mono text-white/70 text-center">
    Save Draft
  </a>
  <a href="plugin-wizard-2.html" class="flex-1 px-5 py-3 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-black font-semibold text-sm text-center font-mono shadow-[0_0_15px_rgba(34,211,238,0.4)] flex items-center justify-center gap-2">
    <span>Next: Configure Logic</span>
    <span class="material-symbols-outlined text-base">arrow_forward</span>
  </a>
</div>

</body>
</html>
