<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Myra AI - Configure Time Trigger</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  body { background-color: #13131b; color: #e4e1ed; font-family: 'Be Vietnam Pro', sans-serif; min-height: 100dvh; }
  .glass { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(138, 235, 255, 0.2); backdrop-filter: blur(12px); }
</style>
</head>
<body class="p-4 pb-24">

<!-- Header -->
<header class="flex items-center justify-between gap-3 mb-6 pt-2">
  <div class="flex items-center gap-3">
    <a href="automation-studio.html" class="p-2 rounded-xl bg-white/5 border border-white/10 hover:border-cyan-400 text-cyan-300">
      <span class="material-symbols-outlined text-xl">arrow_back</span>
    </a>
    <div>
      <h1 class="text-xl font-bold tracking-tight text-cyan-300" style="font-family:'Sora'">TIME_TRIGGER</h1>
      <p class="text-[10px] font-mono text-cyan-400/80">SCHEDULE &amp; CRON CONFIG</p>
    </div>
  </div>
  <span class="text-xs font-mono text-cyan-400">CRON-DAEMON</span>
</header>

<div class="glass rounded-2xl p-5 mb-5 flex flex-col gap-4">
  <div>
    <label class="block text-xs font-mono uppercase text-cyan-300 mb-1.5">Execution Time (24h)</label>
    <input type="time" value="23:00"
      class="w-full bg-[#1b1b23] border border-white/15 rounded-xl px-4 py-3 text-lg text-white focus:outline-none focus:border-cyan-400 font-mono text-center" />
  </div>

  <div>
    <label class="block text-xs font-mono uppercase text-cyan-300 mb-1.5">Repeat Days</label>
    <div class="grid grid-cols-7 gap-1.5 text-center font-mono text-xs">
      <button class="py-2 rounded-lg bg-cyan-400 text-black font-bold">M</button>
      <button class="py-2 rounded-lg bg-cyan-400 text-black font-bold">T</button>
      <button class="py-2 rounded-lg bg-cyan-400 text-black font-bold">W</button>
      <button class="py-2 rounded-lg bg-cyan-400 text-black font-bold">T</button>
      <button class="py-2 rounded-lg bg-cyan-400 text-black font-bold">F</button>
      <button class="py-2 rounded-lg bg-white/10 text-white/50">S</button>
      <button class="py-2 rounded-lg bg-white/10 text-white/50">S</button>
    </div>
  </div>

  <div>
    <label class="block text-xs font-mono uppercase text-cyan-300 mb-1.5">Raw Cron Expression</label>
    <input type="text" value="0 23 * * 1-5" readonly
      class="w-full bg-[#0d0d15] border border-white/10 rounded-xl px-4 py-2.5 text-xs text-cyan-300 font-mono" />
  </div>
</div>

<a href="automation-studio.html" class="w-full py-3.5 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-black font-semibold font-mono text-sm shadow-[0_0_15px_rgba(34,211,238,0.4)] flex items-center justify-center gap-2">
  <span class="material-symbols-outlined text-base">check</span>
  <span>Apply Time Trigger</span>
</a>

</body>
</html>
